name: ERP QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erp-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    name: CRM and Finance QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_ERP_MODULE_PROFILE: core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run test:migrations
      - run: npm run test:core
      - run: npm run test:crm
      - run: npm run test:crm-workflow
      - run: npm run test:crm-pipeline
      - run: npm run test:finance
      - run: npm run test:finance-posting
      - run: npm run test:finance-planning
      - run: npm run test:finance-import
      - run: npm run test:crm-import
      - run: npm run test:security
      - run: npm run test:runtime
      - run: npm run test:ui
      - run: npm run test:layout
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:bundle
      - run: npm run test:http
